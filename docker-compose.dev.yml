# ===========================================
# Secure RAG - Development Overrides
# ===========================================
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: dev_password_change_in_prod

  redis:
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  chromadb:
    ports:
      - "8001:8000"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --workers 1

  celery_worker:
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    command: celery -A celery_worker.celery_app worker --loglevel=debug --concurrency=2

  celery_beat:
    command: celery -A celery_worker.celery_app beat --loglevel=debug

  nginx:
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
